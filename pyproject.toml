[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-trace-ops"
version = "0.1.0"
description = "Autonomous Agentic Workflow Assistant with Tool Calling and OpenTelemetry-style Observability"
authors = [{ name = "Candidate Engineer" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "duckdb>=0.10.0",
    "streamlit>=1.32.0",
    "pandas>=2.2.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
